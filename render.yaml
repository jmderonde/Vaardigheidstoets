# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vaardigheidstoets
    runtime: node
    # "free" slaapt na 15 minuten zonder verkeer (eerste verzoek duurt dan ~1 minuut).
    # Zet voor een wedstrijddag minimaal "starter" in, zodat de app altijd direct reageert.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://vaardigheidstoets.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
